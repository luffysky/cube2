<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>轉磚對戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;0,700;1,700;1,800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&amp;display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">

  <section id="menu" class="screen">
    <div class="menu-in">
      <div class="topbar">
        <button class="me" type="button" data-sheet="profile"><b id="mName"></b><span id="mRank"></span></button>
        <button class="purse" type="button" data-sheet="shop" data-ta="m.shop"><i class="coin"></i><b id="mCoins">0</b></button>
      </div>
      <header class="hero">
        <div class="hero-well"><canvas id="demoCv" aria-hidden="true"></canvas></div>
        <div class="hero-text">
          <h1 class="logo" aria-label="轉磚"><span class="lt lt-t" id="logoA">轉</span><span class="lt lt-b" id="logoB">磚</span></h1>
          <p class="lede" data-t="lede"></p>
        </div>
      </header>
      <nav class="modes" data-ta="m.battle">
        <button class="mode primary" type="button" data-go="rank"><b data-t="m.rank"></b><span data-t="m.rank.s"></span><em id="mRankPts"></em></button>
        <button class="mode" type="button" data-go="battle"><b data-t="m.battle"></b><span data-t="m.battle.s"></span></button>
        <button class="mode" type="button" data-go="online"><b data-t="m.online"></b><span data-t="m.online.s"></span></button>
        <button class="mode" type="button" data-go="ghost"><b data-t="m.ghost"></b><span data-t="m.ghost.s"></span><em id="mGhost"></em></button>
      </nav>
      <h2 class="group" data-t="m.train"></h2>
      <nav class="modes two" data-ta="m.train">
        <button class="mode" type="button" data-go="dojo"><b data-t="m.dojo"></b><span data-t="m.dojo.s"></span><em id="mDojo"></em></button>
        <button class="mode" type="button" data-go="openers"><b data-t="m.open"></b><span data-t="m.open.s"></span><em id="mOpen"></em></button>
        <button class="mode" type="button" data-go="practice"><b data-t="m.practice"></b><span data-t="m.practice.s"></span></button>
        <button class="mode" type="button" data-go="sprint"><b data-t="m.sprint"></b><span data-t="m.sprint.s"></span><em id="mSprint"></em></button>
      </nav>
      <footer class="menu-foot">
        <button class="link" type="button" data-sheet="shop" data-t="m.shop"></button>
        <button class="link" type="button" data-sheet="jobs"><span data-t="m.jobs"></span><i class="dot" id="mJobsDot" hidden></i></button>
        <button class="link" type="button" data-sheet="board" data-t="m.board" id="mBoard" hidden></button>
        <button class="link" type="button" data-sheet="settings" data-t="m.settings"></button>
        <button class="link" type="button" data-sheet="help" data-t="m.help"></button>
      </footer>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <header id="hud">
      <div id="hudL" class="hud-side"></div>
      <div id="hudC"></div>
      <div id="hudR" class="hud-side"></div>
    </header>
    <div id="strip" hidden></div>
    <main id="stage">
      <div id="oppWide" hidden><span class="who" id="oppNameW"></span><div class="frame" id="oppFrame"></div></div>
      <div id="colL" class="col">
        <button id="holdBox" class="slot" type="button" data-ta="hold"><span class="slot-label" data-t="hold"></span><canvas id="holdCv"></canvas></button>
        <button id="itemBox" class="slot" type="button" data-ta="a.ITEM" hidden><span class="slot-label" data-t="item"></span><canvas id="itemCv"></canvas></button>
        <div id="oppMini" class="slot" hidden><span class="slot-label" id="oppName"></span><canvas id="oppCv"></canvas></div>
        <div id="chips" class="chips" aria-live="off"></div>
        <div id="sideL" class="sidekeys" hidden></div>
      </div>
      <div id="wellWrap">
        <canvas id="wellCv"></canvas>
        <div id="pops"></div>
        <div id="banner"></div>
        <div id="toast" class="toast" role="status" hidden></div>
      </div>
      <div id="colR" class="col">
        <div id="nextBox" class="slot"><span class="slot-label" data-t="next"></span><canvas id="nextCv"></canvas></div>
        <div id="tools" class="col" hidden></div>
        <button id="pauseBtn" class="tool" type="button" data-t="pause"></button>
        <div id="sideR" class="sidekeys" hidden>
          <button class="key" type="button" id="halfKey" data-k="180" data-t="k.half" hidden></button>
          <button class="key" type="button" id="holdKey" data-k="HOLD" data-t="hold"></button>
          <button class="key" type="button" id="itemKey" data-k="ITEM" data-ta="a.ITEM" hidden></button>
        </div>
      </div>
    </main>
    <footer id="pad" hidden>
      <button class="key" type="button" data-k="L" data-ta="a.L"><svg viewBox="0 0 32 32"><path d="M20 6 10 16l10 10"/></svg></button>
      <button class="key" type="button" data-k="R" data-ta="a.R"><svg viewBox="0 0 32 32"><path d="m12 6 10 10-10 10"/></svg></button>
      <button class="key" type="button" data-k="CCW" data-ta="a.CCW"><svg viewBox="0 0 32 32"><path d="M9 13a9 9 0 1 1 1.5 9.5"/><path d="M8 5v8h8"/></svg><span data-t="k.ccw"></span></button>
      <button class="key" type="button" data-k="CW" data-ta="a.CW"><svg viewBox="0 0 32 32"><path d="M23 13a9 9 0 1 0-1.5 9.5"/><path d="M24 5v8h-8"/></svg><span data-t="k.cw"></span></button>
      <button class="key" type="button" data-k="D" data-ta="a.D"><svg viewBox="0 0 32 32"><path d="m8 12 8 9 8-9"/></svg><span data-t="k.soft"></span></button>
      <button class="key" type="button" data-k="HD" data-ta="a.HD"><svg viewBox="0 0 32 32"><path d="m8 9 8 9 8-9"/><path d="M7 25h18"/></svg><span data-t="k.hard"></span></button>
    </footer>
    <div id="rotate" hidden><p data-t="rotatePhone"></p></div>
  </section>

  <div id="sheet" hidden><div id="sheetCard" role="dialog" aria-modal="true"></div></div>
  <div id="mtoast" class="toast" role="status" hidden></div>
</div>
