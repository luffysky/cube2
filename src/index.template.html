<!DOCTYPE html>

<body>
<div id="app">

  <section id="menu" class="screen">
    <div class="menu-in">
      <div class="topbar">
        <button class="burger" type="button" id="mDrawer" aria-controls="drawer" aria-expanded="false" data-ta="dr.open"><i></i><i></i><i></i></button>
        <button class="me" type="button" data-sheet="profile"><b id="mName"></b><span id="mRank"></span></button>
        <button class="purse" type="button" data-sheet="shop" data-ta="m.shop"><i class="coin"></i><b id="mCoins">0</b></button>
      </div>
      <header class="hero">
        <div class="hero-well"><canvas id="demoCv" aria-hidden="true"></canvas></div>
        <div class="hero-text">
          <h1 class="logo" aria-label="轉磚"><span class="lt lt-t" id="logoA">轉</span><span class="lt lt-b" id="logoB">磚</span></h1>
          <p class="lede" data-t="lede"></p>
        </div>
      </header>
      <nav class="modes" data-ta="m.battle">
        <button class="mode primary" type="button" data-go="rank"><b data-t="m.rank"></b><span data-t="m.rank.s"></span><em id="mRankPts"></em></button>
        <button class="mode" type="button" data-go="battle"><b data-t="m.battle"></b><span data-t="m.battle.s"></span></button>
        <button class="mode" type="button" data-go="online"><b data-t="m.online"></b><span data-t="m.online.s"></span></button>
        <button class="mode" type="button" data-go="ghost"><b data-t="m.ghost"></b><span data-t="m.ghost.s"></span><em id="mGhost"></em></button>
      </nav>
      <h2 class="group" data-t="m.train"></h2>
      <nav class="modes two" data-ta="m.train">
        <button class="mode" type="button" data-go="levels"><b data-t="lv.menuT"></b><span data-t="lv.menuS"></span><em id="mLevels"></em></button>
        <button class="mode" type="button" data-go="weather"><b data-t="wx.menuT"></b><span data-t="wx.menuS"></span></button>
        <button class="mode" type="button" data-go="dojo"><b data-t="m.dojo"></b><span data-t="m.dojo.s"></span><em id="mDojo"></em></button>
        <button class="mode" type="button" data-go="openers"><b data-t="m.open"></b><span data-t="m.open.s"></span><em id="mOpen"></em></button>
        <button class="mode" type="button" data-go="practice"><b data-t="m.practice"></b><span data-t="m.practice.s"></span></button>
        <button class="mode" type="button" data-go="sprint"><b data-t="m.sprint"></b><span data-t="m.sprint.s"></span><em id="mSprint"></em></button>
      </nav>
      <footer class="menu-foot">
        <button class="link" type="button" data-sheet="shop" data-t="m.shop"></button>
        <button class="link" type="button" data-sheet="boxes"><span data-t="bx.title"></span><i class="dot" id="mBoxDot" hidden></i></button>
        <button class="link" type="button" data-sheet="bonus"><span data-t="bn.title"></span></button>
        <button class="link" type="button" data-sheet="jobs"><span data-t="m.jobs"></span><i class="dot" id="mJobsDot" hidden></i></button>
        <button class="link" type="button" data-sheet="board" data-t="m.board" id="mBoard" hidden></button>
        <button class="link" type="button" data-sheet="srAccount" data-t="sr.menu"></button>
        <button class="link" type="button" data-sheet="settings" data-t="m.settings"></button>
        <button class="link" type="button" data-sheet="help" data-t="m.help"></button>
        <button class="link" type="button" data-t="pwa.install" id="mInstall" hidden></button>
        <a class="link" href="games/" data-t="m.games"></a>
      </footer>
      <p class="about" data-t="seo.about"></p>
      <p class="about cn-notice" id="cnNotice" hidden></p>
      <p class="about legal"><a href="privacy.html" data-t="lg.privacy"></a>　<a href="terms.html" data-t="lg.terms"></a></p>
    </div>
    <!-- the side menu: everything on the page in one place (the page itself keeps all of it too) -->
    <div class="scrim" id="drawerScrim" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true" data-ta="dr.title" tabindex="-1">
      <div class="dr-head">
        <button class="dr-close" type="button" id="drClose" data-ta="close">✕</button>
        <button class="dr-me" type="button" data-sheet="profile"><i class="dr-av" id="drAv"></i><span><b id="drName"></b><small id="drRank"></small></span></button>
        <div class="dr-row"><span class="dr-coins"><i class="coin"></i><b id="drCoins">0</b></span><span class="dr-acct" id="drAcct"></span></div>
      </div>
      <nav class="dr-body">
        <a class="dr-sr" href="https://games.snowrealm.pet/" target="_blank" rel="noopener"><i class="ic" data-ic="snow"></i><span><b>SnowRealm Games</b><small data-t="dr.srHome"></small></span><i class="ic go" data-ic="out"></i></a>
        <section class="dr-grp" data-tone="acct"><h3 data-t="dr.account"></h3><div class="dr-list">
          <button type="button" data-sheet="profile"><i class="ic" data-ic="user"></i><span data-t="dr.profile"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="srAccount" id="drSignin"><i class="ic" data-ic="key"></i><span data-t="sr.menu"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="cloud"><i class="ic" data-ic="cloud"></i><span data-t="cl.title"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="drLogout"><i class="ic" data-ic="logout"></i><span data-t="dr.logout"></span><i class="ic go" data-ic="chev"></i></button>
        </div></section>
        <section class="dr-grp" data-tone="battle"><h3 data-t="m.battle"></h3><div class="dr-list">
          <button type="button" data-go="rank"><i class="ic" data-ic="trophy"></i><span data-t="m.rank"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="battle"><i class="ic" data-ic="swords"></i><span data-t="m.battle"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="online"><i class="ic" data-ic="globe"></i><span data-t="m.online"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="ghost"><i class="ic" data-ic="ghost"></i><span data-t="m.ghost"></span><i class="ic go" data-ic="chev"></i></button>
        </div></section>
        <section class="dr-grp" data-tone="train"><h3 data-t="m.train"></h3><div class="dr-list">
          <button type="button" data-go="levels"><i class="ic" data-ic="flag"></i><span data-t="lv.menuT"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="weather"><i class="ic" data-ic="sun"></i><span data-t="wx.menuT"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="dojo"><i class="ic" data-ic="rotate"></i><span data-t="m.dojo"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="openers"><i class="ic" data-ic="book"></i><span data-t="m.open"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="practice"><i class="ic" data-ic="target"></i><span data-t="m.practice"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-go="sprint"><i class="ic" data-ic="timer"></i><span data-t="m.sprint"></span><i class="ic go" data-ic="chev"></i></button>
        </div></section>
        <section class="dr-grp" data-tone="gold"><h3 data-t="dr.rewards"></h3><div class="dr-list">
          <button type="button" data-sheet="shop"><i class="ic" data-ic="bag"></i><span data-t="m.shop"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="shop" data-sitepick><i class="ic" data-ic="palette"></i><span data-t="k.site"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="boxes"><i class="ic" data-ic="gift"></i><span data-t="bx.title"></span><i class="dot" id="drBoxDot" hidden></i><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="bonus"><i class="ic" data-ic="slot"></i><span data-t="bn.title"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="jobs"><i class="ic" data-ic="list"></i><span data-t="m.jobs"></span><i class="dot" id="drJobsDot" hidden></i><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="board" id="drBoard" hidden><i class="ic" data-ic="chart"></i><span data-t="m.board"></span><i class="ic go" data-ic="chev"></i></button>
        </div></section>
        <section class="dr-grp" data-tone="games"><h3 data-t="dr.games"></h3><div class="dr-list">
          <a href="games/"><i class="ic" data-ic="grid"></i><span data-t="dr.allGames"></span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/snake/"><i class="ic" data-ic="snake"></i><span>磚蛇</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/breakout/"><i class="ic" data-ic="ball"></i><span>打磚塊</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/stack/"><i class="ic" data-ic="layers"></i><span>疊磚塔</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/push/"><i class="ic" data-ic="box"></i><span>推磚倉庫</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/merge/"><i class="ic" data-ic="merge"></i><span>磚塊合成</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/sort/"><i class="ic" data-ic="sort"></i><span>分磚</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/picross/"><i class="ic" data-ic="pixel"></i><span>磚畫謎</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/pipes/"><i class="ic" data-ic="pipe"></i><span>磚道</span><i class="ic go" data-ic="chev"></i></a>
          <a href="games/sweep/"><i class="ic" data-ic="mine"></i><span>掃磚</span><i class="ic go" data-ic="chev"></i></a>
        </div></section>
        <section class="dr-grp" data-tone="more"><h3 data-t="dr.more"></h3><div class="dr-list">
          <button type="button" data-sheet="settings"><i class="ic" data-ic="gear"></i><span data-t="m.settings"></span><i class="ic go" data-ic="chev"></i></button>
          <button type="button" data-sheet="help"><i class="ic" data-ic="help"></i><span data-t="m.help"></span><i class="ic go" data-ic="chev"></i></button>
          <a href="privacy.html"><i class="ic" data-ic="shield"></i><span data-t="lg.privacy"></span><i class="ic go" data-ic="chev"></i></a>
          <a href="terms.html"><i class="ic" data-ic="doc"></i><span data-t="lg.terms"></span><i class="ic go" data-ic="chev"></i></a>
        </div></section>
      </nav>
    </aside>
  </section>

  <section id="play" class="screen" hidden>
    <header id="hud">
      <div id="hudL" class="hud-side"></div>
      <div id="hudC"></div>
      <div id="hudR" class="hud-side"></div>
    </header>
    <div id="strip" hidden></div>
    <main id="stage">
      <div id="oppWide" hidden><span class="who" id="oppNameW"></span><div class="frame" id="oppFrame"></div></div>
      <div id="colL" class="col">
        <button id="holdBox" class="slot" type="button" data-ta="hold"><span class="slot-label" data-t="hold"></span><canvas id="holdCv"></canvas></button>
        <div id="wxInfo" class="wxinfo" aria-live="off" hidden></div>
        <button id="itemBox" class="slot" type="button" data-ta="a.ITEM" hidden><span class="slot-label" data-t="item"></span><canvas id="itemCv"></canvas></button>
        <div id="oppMini" class="slot" hidden><span class="slot-label" id="oppName"></span><canvas id="oppCv"></canvas></div>
        <div id="chips" class="chips" aria-live="off"></div>
        <div id="sideL" class="sidekeys" hidden></div>
      </div>
      <div id="wellWrap">
        <canvas id="wellCv"></canvas>
        <div id="pops"></div>
        <div id="banner"></div>
        <div id="toast" class="toast" role="status" hidden></div>
      </div>
      <div id="colR" class="col">
        <div id="nextBox" class="slot"><span class="slot-label" data-t="next"></span><canvas id="nextCv"></canvas></div>
        <div id="tools" class="col" hidden></div>
        <button id="pauseBtn" class="tool" type="button" data-t="pause"></button>
        <div id="sideR" class="sidekeys" hidden>
          <button class="key" type="button" id="halfKey" data-k="180" data-t="k.half" hidden></button>
          <button class="key" type="button" id="holdKey" data-k="HOLD" data-t="hold"></button>
          <button class="key" type="button" id="itemKey" data-k="ITEM" data-ta="a.ITEM" hidden></button>
        </div>
      </div>
    </main>
    <footer id="pad" hidden>
      <button class="key" type="button" data-k="L" data-ta="a.L"><svg viewBox="0 0 32 32"><path d="M20 6 10 16l10 10"/></svg></button>
      <button class="key" type="button" data-k="R" data-ta="a.R"><svg viewBox="0 0 32 32"><path d="m12 6 10 10-10 10"/></svg></button>
      <button class="key" type="button" data-k="CCW" data-ta="a.CCW"><svg viewBox="0 0 32 32"><path d="M9 13a9 9 0 1 1 1.5 9.5"/><path d="M8 5v8h8"/></svg><span data-t="k.ccw"></span></button>
      <button class="key" type="button" data-k="CW" data-ta="a.CW"><svg viewBox="0 0 32 32"><path d="M23 13a9 9 0 1 0-1.5 9.5"/><path d="M24 5v8h-8"/></svg><span data-t="k.cw"></span></button>
      <button class="key" type="button" data-k="D" data-ta="a.D"><svg viewBox="0 0 32 32"><path d="m8 12 8 9 8-9"/></svg><span data-t="k.soft"></span></button>
      <button class="key" type="button" data-k="HD" data-ta="a.HD"><svg viewBox="0 0 32 32"><path d="m8 9 8 9 8-9"/><path d="M7 25h18"/></svg><span data-t="k.hard"></span></button>
    </footer>
    <div id="rotate" hidden><p data-t="rotatePhone"></p></div>
  </section>

  <div id="sheet" hidden><div id="sheetCard" role="dialog" aria-modal="true"></div></div>
  <div id="mtoast" class="toast" role="status" hidden></div>
</div>
