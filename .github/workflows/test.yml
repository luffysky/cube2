name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    name: rules, server and sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the page in the repository is the one build.js makes
        run: |
          cp index.html /tmp/index.before.html
          node build.js
          cmp index.html /tmp/index.before.html
      - run: npm test
