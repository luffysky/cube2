# Words written only in Chinese get a machine translation, by itself.
# On every push that touches the game's words: tools/i18n-scan.js lists what has no English, Japanese or Korean yet,
# tools/i18n-auto.py translates it with Argos Translate (free, open source, runs here on the runner: nothing is sent
# to a translation service), build.js puts it into the page and server/i18n-data.json, and the result is committed
# back to main. Vercel then deploys it, and the first save after the deployment copies the words into the database.
name: auto-translate
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/dict.js', 'tools/i18n-*', 'i18n/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-translate
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: anything to translate?
        id: scan
        run: |
          node tools/i18n-scan.js
          echo "n=$(node -e "console.log(require('./i18n/todo.json').length)")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.scan.outputs.n != '0'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/i18n-requirements.txt
      - name: the translation models (kept between runs)
        if: steps.scan.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-zt_en-en_ja-en_ko-v1
      - name: translate
        if: steps.scan.outputs.n != '0'
        run: |
          pip install -r tools/i18n-requirements.txt
          python tools/i18n-auto.py
          node tools/i18n-scan.js --check
      - name: build and test
        if: steps.scan.outputs.n != '0'
        run: |
          node build.js
          npm test
      - name: commit the translations
        if: steps.scan.outputs.n != '0'
        run: |
          git config user.name "zhuanzhuan-i18n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/auto.json index.html server/i18n-data.json vercel.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m "i18n：自動翻譯 ${{ steps.scan.outputs.n }} 條（Argos Translate，機器翻譯）"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
