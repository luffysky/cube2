# Words written only in Chinese get a machine translation, by itself (C-024, C-025).
# On every push that touches the game's words: tools/i18n-scan.js lists what has no English, Japanese or Korean yet.
# If the repository has the secret GEMINI_API_KEY, tools/i18n-auto.py translates the list with Google Gemini (only
# the game's own words are sent), build.js puts it into the pages and server/i18n-data.json, the tests run, and the
# result is committed back to main; Vercel deploys it and the server copies the words into the database.
# Without the secret nothing is translated: the list is shown in the run, and Claude translates by hand.
# (Argos Translate is not used: the Owner turned it down for its quality.)
name: auto-translate
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/dict.js', 'tools/i18n-*', 'i18n/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-translate
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: anything to translate?
        id: scan
        run: |
          node tools/i18n-scan.js
          echo "n=$(node -e "console.log(require('./i18n/todo.json').length)")" >> "$GITHUB_OUTPUT"
      - name: translate with Gemini
        if: steps.scan.outputs.n != '0' && env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 tools/i18n-auto.py --engine gemini
          node tools/i18n-scan.js
      - name: no key yet
        if: steps.scan.outputs.n != '0' && env.GEMINI_API_KEY == ''
        run: echo "::notice::${{ steps.scan.outputs.n }} words wait for a translation (no GEMINI_API_KEY secret); see i18n/todo.json"
      - name: build and test
        if: steps.scan.outputs.n != '0' && env.GEMINI_API_KEY != ''
        run: |
          node build.js
          npm test
      - name: commit the translations
        if: steps.scan.outputs.n != '0' && env.GEMINI_API_KEY != ''
        run: |
          git config user.name "zhuanzhuan-i18n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n index.html server/i18n-data.json vercel.json sw.js games
          git diff --cached --quiet && exit 0
          git commit -m "i18n：自動翻譯（Gemini，機器翻譯）"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
