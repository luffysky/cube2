<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.sweep" data-desc="sw.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掃磚 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="掃磚：敲開水泥磚，看數字推出哪幾塊底下藏著裂縫。打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/sweep/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/sweep/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/sweep/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/sweep/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/sweep/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/sweep/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/sweep/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=9d91105f2f">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<div id="gboot" role="status" aria-live="polite" style="--gb:#8C939B"><div class="gb-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p><span data-t="g.loading">載入中</span><b class="gb-d"><i>.</i><i>.</i><i>.</i></b></p></div>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.sweep">掃磚</h1>
    <span></span>
  </div>
  <div class="stats">
    <div class="hearts-box" style="align-items:flex-start"><b id="hearts" data-ta="g.livesA" aria-label="剩下的命">♥♥♥♥♥</b><span data-th="sw.status">時間 <i id="time">0:00</i>・裂縫 <i id="left">0</i></span></div>
    <div class="row mode" role="group" data-ta="sw.modeA" aria-label="點磚塊要做什麼"><button class="btn plain" type="button" id="modeDig" aria-pressed="true" data-t="sw.dig">敲開</button><button class="btn plain" type="button" id="modeFlag" aria-pressed="false" data-t="sw.flag">插旗</button></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" data-ta="sw.board" aria-label="掃磚的場地"></canvas>
    <div class="over" id="intro">
      <h2 data-t="n.sweep">掃磚</h2>
      <p data-t="sw.p1">點一下敲開水泥磚。數字是周圍 8 塊裡藏了幾道裂縫；周圍都沒有的會自己一起打開。第一下一定安全。</p>
      <p data-t="sw.p2">覺得有裂縫的磚就插旗（長按、滑鼠右鍵或切到插旗）。敲到裂縫少一條命，有 5 條命。把沒裂縫的磚全部敲開就完成，記最快時間。</p>
      <div class="seg" role="radiogroup" data-ta="g.lvA" aria-label="難度">
        <button type="button" role="radio" data-lv="easy" data-t="g.easy">簡單</button>
        <button type="button" role="radio" data-lv="normal" data-t="g.normal">普通</button>
        <button type="button" role="radio" data-lv="hard" data-t="g.hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go" data-t="g.start">開始</button></div>
      
    </div>
    <div class="over reveal" id="end" hidden>
      <h2 id="endTitle" data-t="sw.done">全部敲完了！</h2>
      <div class="big" id="endScore">0:00</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again" data-t="g.again2">再一局</button><button class="btn plain" type="button" id="toIntro" data-t="g.change">換難度</button><a class="btn plain" href="../" data-t="g.other">其他遊戲</a></div>
    </div>
  </div>
</main>
<script src="../words.js?v=443fb044a9"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=34f4bc7609"></script>
<script src="sweep.js?v=16e9ce76a3"></script>
<script src="../drawer-icons.js?v=04bc183400"></script>
<script src="../nav.js?v=58f8ba90e8"></script>
</body>
</html>
