<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掃磚 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="掃磚：敲開水泥磚，看數字推出哪幾塊底下藏著裂縫。打開瀏覽器就能玩。">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css">
</head>
<body>
<main class="game">
  <div class="bar">
    <a href="../">← 磚塊遊戲</a>
    <h1>掃磚</h1>
    <span></span>
  </div>
  <div class="stats">
    <div class="hearts-box" style="align-items:flex-start"><b id="hearts" aria-label="剩下的命">♥♥♥♥♥</b><span>時間 <i id="time">0:00</i>・裂縫 <i id="left">0</i></span></div>
    <div class="row mode" role="group" aria-label="點磚塊要做什麼"><button class="btn plain" type="button" id="modeDig" aria-pressed="true">敲開</button><button class="btn plain" type="button" id="modeFlag" aria-pressed="false">插旗</button></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" aria-label="掃磚的場地"></canvas>
    <div class="over" id="intro">
      <h2>掃磚</h2>
      <p>點一下敲開水泥磚。數字是周圍 8 塊裡藏了幾道裂縫；周圍都沒有的會自己一起打開。第一下一定安全。</p>
      <p>覺得有裂縫的磚就插旗（長按、滑鼠右鍵或切到插旗）。敲到裂縫少一條命，有 5 條命。把沒裂縫的磚全部敲開就完成，記最快時間。</p>
      <div class="seg" role="radiogroup" aria-label="難度">
        <button type="button" role="radio" data-lv="easy">簡單</button>
        <button type="button" role="radio" data-lv="normal">普通</button>
        <button type="button" role="radio" data-lv="hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go">開始</button></div>
      
    </div>
    <div class="over reveal" id="end" hidden>
      <h2 id="endTitle">全部敲完了！</h2>
      <div class="big" id="endScore">0:00</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again">再一局</button><button class="btn plain" type="button" id="toIntro">換難度</button><a class="btn plain" href="../">其他遊戲</a></div>
    </div>
  </div>
</main>
<script src="sweep.js"></script>
</body>
</html>
