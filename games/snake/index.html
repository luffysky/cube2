<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.snake" data-desc="sn.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磚蛇 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="磚蛇：吃磚變長，身上同色的磚連成 3 塊就會消掉。打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/snake/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/snake/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/snake/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/snake/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/snake/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/snake/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/snake/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=9d91105f2f">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<div id="gboot" role="status" aria-live="polite" style="--gb:#37C29A"><div class="gb-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p><span data-t="g.loading">載入中</span><b class="gb-d"><i>.</i><i>.</i><i>.</i></b></p></div>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.snake">磚蛇</h1>
    <button type="button" id="pause" data-t="g.pause">暫停</button>
  </div>
  <div class="stats">
    <div><b id="score">0</b><span data-t="g.score">分數</span></div>
    <div class="hearts-box"><b id="hearts" data-ta="g.livesA" aria-label="剩下的命">♥♥♥♥♥</b><span data-t="g.lives">命</span></div>
    <div><b id="best">0</b><span data-t="g.best">最佳</span></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" data-ta="sn.board" aria-label="磚蛇的場地"></canvas>
    <div class="over" id="intro">
      <h2 data-t="n.snake">磚蛇</h2>
      <p data-t="sn.p1">吃磚會變長，吃到的磚接在頭後面。身上同一個顏色的磚連成 3 塊以上就會消掉，蛇變短、分數加倍。</p>
      <p data-t="sn.p2">有 5 條命，撞到牆、水泥、豎起的尖刺或自己會少一條。吃到一定數量後會出現尖刺和傳送門：尖刺會輪流豎起來，出現黃色斜紋就是快豎起了；鑽進一個傳送門會從另一個出來。</p>
      <div class="seg" role="radiogroup" data-ta="g.lvA" aria-label="難度">
        <button type="button" role="radio" data-lv="easy" data-t="g.easy">簡單</button>
        <button type="button" role="radio" data-lv="normal" data-t="g.normal">普通</button>
        <button type="button" role="radio" data-lv="hard" data-t="g.hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go" data-t="g.start">開始</button></div>
      <p id="keysHint" data-t="sn.keys">方向鍵或 WASD 控制，空白鍵暫停</p>
    </div>
    <div class="over" id="end" hidden>
      <h2 id="endTitle" data-t="g.over">撞到了</h2>
      <div class="big" id="endScore">0</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again" data-t="g.again">再玩一次</button><button class="btn plain" type="button" id="toIntro" data-t="g.change">換難度</button><a class="btn plain" href="../" data-t="g.other">其他遊戲</a></div>
    </div>
    <div class="over soft" id="ouch" hidden><h2 id="ouchT" data-t="sn.hit">撞到了</h2><p id="ouchP"></p></div>
    <div class="over" id="paused" hidden>
      <h2 data-t="g.paused">暫停中</h2>
      <div class="row"><button class="btn" type="button" id="resume" data-t="g.resume">繼續</button></div>
    </div>
  </div>
  <div class="pad" id="pad">
    <button type="button" data-d="up" data-ta="g.up" aria-label="上">▲</button>
    <button type="button" data-d="left" data-ta="g.left" aria-label="左">◀</button>
    <button type="button" data-d="down" data-ta="g.down" aria-label="下">▼</button>
    <button type="button" data-d="right" data-ta="g.right" aria-label="右">▶</button>
  </div>
  <p class="hint" data-t="sn.swipe">也可以在場地上滑動來轉彎</p>
</main>
<script src="../words.js?v=443fb044a9"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=34f4bc7609"></script>
<script src="snake.js?v=4f8b1321d4"></script>
<script src="../drawer-icons.js?v=04bc183400"></script>
<script src="../nav.js?v=58f8ba90e8"></script>
</body>
</html>
