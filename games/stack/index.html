<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.stack" data-desc="st.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>疊磚塔 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="疊磚塔：看準時機放下磚塊，對不齊的地方會被切掉，看你能疊多高。打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/stack/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/stack/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/stack/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/stack/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/stack/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/stack/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/stack/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=9d91105f2f">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<div id="gboot" role="status" aria-live="polite" style="--gb:#F5B82E"><div class="gb-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p><span data-t="g.loading">載入中</span><b class="gb-d"><i>.</i><i>.</i><i>.</i></b></p></div>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.stack">疊磚塔</h1>
    <button type="button" id="pause" data-t="g.pause">暫停</button>
  </div>
  <div class="stats">
    <div><b id="score">0</b><span data-t="g.score">分數</span></div>
    <div class="hearts-box"><b id="hearts" data-ta="g.livesA" aria-label="剩下的命">♥♥♥♥♥</b><span data-tk="st.floors" data-tv="stage"><i id="stage">0</i> 層</span></div>
    <div><b id="best">0</b><span data-t="g.best">最佳</span></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" data-ta="st.board" aria-label="疊磚塔的場地"></canvas>
    <div class="over" id="intro">
      <h2 data-t="n.stack">疊磚塔</h2>
      <p data-t="st.p1">磚塊會左右滑，看準時機放下去。超出下面那塊的部分會被切掉，塔會越來越窄。</p>
      <p data-t="st.p2">剛好對齊就是「完美」，不會被切；連續 3 次完美磚塊會變寬一點。整塊沒放到塔上少一條命，有 5 條命。越高滑得越快，10 層以後磚塊會從兩邊來。</p>
      <div class="seg" role="radiogroup" data-ta="g.lvA" aria-label="難度">
        <button type="button" role="radio" data-lv="easy" data-t="g.easy">簡單</button>
        <button type="button" role="radio" data-lv="normal" data-t="g.normal">普通</button>
        <button type="button" role="radio" data-lv="hard" data-t="g.hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go" data-t="g.start">開始</button></div>
      <p id="keysHint" data-t="st.keys">空白鍵、Enter 或點一下場地放下磚塊</p>
    </div>
    <div class="over" id="end" hidden>
      <h2 data-t="g.over">命用完了</h2>
      <div class="big" id="endScore">0</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again" data-t="g.again">再玩一次</button><button class="btn plain" type="button" id="toIntro" data-t="g.change">換難度</button><a class="btn plain" href="../" data-t="g.other">其他遊戲</a></div>
    </div>
    <div class="over soft" id="ouch" hidden><h2 id="ouchT"></h2><p id="ouchP"></p></div>
    <div class="over" id="paused" hidden>
      <h2 data-t="g.paused">暫停中</h2>
      <div class="row"><button class="btn" type="button" id="resume" data-t="g.resume">繼續</button></div>
    </div>
  </div>
</main>
<script src="../words.js?v=443fb044a9"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=34f4bc7609"></script>
<script src="stack.js?v=a34ab47eec"></script>
<script src="../drawer-icons.js?v=04bc183400"></script>
<script src="../nav.js?v=58f8ba90e8"></script>
</body>
</html>
