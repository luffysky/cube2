<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.sort" data-desc="so.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分磚 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="分磚：把混在一起的彩磚一疊一疊分好，每疊只留一種顏色。60 關，打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/sort/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/sort/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/sort/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/sort/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/sort/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/sort/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/sort/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=a46ffde98c">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.sort">分磚</h1>
    <button type="button" id="levels" data-t="g.levels">關卡</button>
  </div>
  <div class="stats">
    <div><b id="moves">0</b><span data-t="g.moves">步數</span></div>
    <div class="hearts-box"><b class="lvname" id="lvName">關卡</b><span data-t="so.goalNote">3 星步數內完成</span></div>
    <div><b id="goal">0</b><span data-t="so.goal">最少步數</span></div>
  </div>
  <div class="board push sort" id="board">
    <canvas id="cv" data-ta="so.board" aria-label="分磚的場地"></canvas>
    <div class="over list" id="list"></div>
    <div class="over" id="win" hidden>
      <h2 data-t="g.win">過關！</h2>
      <div class="big stars" id="winStars">★★★</div>
      <p id="winNote"></p>
      <div class="row"><button class="btn" type="button" id="next" data-t="g.next">下一關</button><button class="btn plain" type="button" id="again" data-t="g.again">再玩一次</button><button class="btn plain" type="button" id="toList" data-t="g.list">關卡列表</button></div>
    </div>
  </div>
  <div class="row tools"><button class="btn plain" type="button" id="undo" data-t="g.undo">上一步</button><button class="btn plain" type="button" id="restart" data-t="g.restart">重來</button></div>
  <p class="hint" id="keysHint" data-t="so.keys">點一疊再點另一疊；數字鍵選疊，Z 上一步，R 重來</p>
</main>
<script src="../words.js?v=e90ce10ba1"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=2453e265fc"></script>
<script src="levels.js?v=24261c8758"></script>
<script src="sort.js?v=34683f6d54"></script>
<script src="../drawer-icons.js?v=9cd5c51bd0"></script>
<script src="../nav.js?v=a0ad2d2f90"></script>
</body>
</html>
