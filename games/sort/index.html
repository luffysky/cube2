<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分磚 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="分磚：把混在一起的彩磚一疊一疊分好，每疊只留一種顏色。60 關，打開瀏覽器就能玩。">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css">
</head>
<body>
<main class="game">
  <div class="bar">
    <a href="../">← 磚塊遊戲</a>
    <h1>分磚</h1>
    <button type="button" id="levels">關卡</button>
  </div>
  <div class="stats">
    <div><b id="moves">0</b><span>步數</span></div>
    <div class="hearts-box"><b class="lvname" id="lvName">關卡</b><span>3 星步數內完成</span></div>
    <div><b id="goal">0</b><span>最少步數</span></div>
  </div>
  <div class="board push sort" id="board">
    <canvas id="cv" aria-label="分磚的場地"></canvas>
    <div class="over list" id="list"></div>
    <div class="over" id="win" hidden>
      <h2>過關！</h2>
      <div class="big stars" id="winStars">★★★</div>
      <p id="winNote"></p>
      <div class="row"><button class="btn" type="button" id="next">下一關</button><button class="btn plain" type="button" id="again">再玩一次</button><button class="btn plain" type="button" id="toList">關卡列表</button></div>
    </div>
  </div>
  <div class="row tools"><button class="btn plain" type="button" id="undo">上一步</button><button class="btn plain" type="button" id="restart">重來</button></div>
  <p class="hint" id="keysHint">點一疊再點另一疊；數字鍵選疊，Z 上一步，R 重來</p>
</main>
<script src="levels.js"></script>
<script src="sort.js"></script>
</body>
</html>
