<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.push" data-desc="pu.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推磚倉庫 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="推磚倉庫：把每塊磚推到它的位置上，只能推不能拉。60 關，打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/push/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/push/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/push/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/push/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/push/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/push/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/push/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=9d91105f2f">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<div id="gboot" role="status" aria-live="polite" style="--gb:#F1EADB"><div class="gb-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p><span data-t="g.loading">載入中</span><b class="gb-d"><i>.</i><i>.</i><i>.</i></b></p></div>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.push">推磚倉庫</h1>
    <button type="button" id="levels" data-t="g.levels">關卡</button>
  </div>
  <div class="stats">
    <div><b id="moves">0</b><span data-t="g.moves">步數</span></div>
    <div class="hearts-box"><b class="lvname" id="lvName">關卡</b><span id="lvGoal"></span></div>
    <div><b id="pushes">0</b><span data-t="pu.pushes">推數</span></div>
  </div>
  <div class="board push" id="board">
    <canvas id="cv" data-ta="pu.board" aria-label="推磚倉庫的場地"></canvas>
    <div class="over list" id="list"></div>
    <div class="over" id="win" hidden>
      <h2 data-t="g.win">過關！</h2>
      <div class="big stars" id="winStars">★★★</div>
      <p id="winNote"></p>
      <div class="row"><button class="btn" type="button" id="next" data-t="g.next">下一關</button><button class="btn plain" type="button" id="again" data-t="g.again">再玩一次</button><button class="btn plain" type="button" id="toList" data-t="g.list">關卡列表</button></div>
    </div>
  </div>
  <div class="row tools"><button class="btn plain" type="button" id="undo" data-t="g.undo">上一步</button><button class="btn plain" type="button" id="restart" data-t="g.restart">重來</button></div>
  <div class="pad" id="pad">
    <button type="button" data-d="up" data-ta="g.up" aria-label="上">▲</button>
    <button type="button" data-d="left" data-ta="g.left" aria-label="左">◀</button>
    <button type="button" data-d="down" data-ta="g.down" aria-label="下">▼</button>
    <button type="button" data-d="right" data-ta="g.right" aria-label="右">▶</button>
  </div>
  <p class="hint" id="keysHint" data-t="pu.keys">方向鍵或 WASD 移動，Z 上一步，R 重來</p>
</main>
<script src="../words.js?v=e7601ec874"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=2453e265fc"></script>
<script src="levels.js?v=7a6f2b871a"></script>
<script src="push.js?v=03d9756b62"></script>
<script src="../drawer-icons.js?v=f43d4451e9"></script>
<script src="../nav.js?v=e272c06d10"></script>
</body>
</html>
