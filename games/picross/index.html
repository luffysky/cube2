<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.picross" data-desc="pi.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磚畫謎 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="磚畫謎：照每排每列旁邊的數字把磚填上，填完會出現一幅畫。打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/picross/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/picross/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/picross/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/picross/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/picross/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/picross/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/picross/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=6229800d26">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.picross">磚畫謎</h1>
    <button type="button" id="levels" data-t="pi.pics">圖片</button>
  </div>
  <div class="stats">
    <div class="hearts-box" style="align-items:flex-start"><b id="hearts" data-ta="g.livesA" aria-label="剩下的命">♥♥♥♥♥</b><span data-t="g.lives">命</span></div>
    <div class="hearts-box"><b class="lvname" id="lvName" data-t="n.picross">磚畫謎</b><span data-t="pi.mistake">填錯一格少一條命</span></div>
    <div class="row mode" role="group" data-ta="pi.modeA" aria-label="點格子要做什麼"><button class="btn plain" type="button" id="modeFill" aria-pressed="true" data-t="pi.fill">填磚</button><button class="btn plain" type="button" id="modeCross" aria-pressed="false" data-t="pi.cross">打叉</button></div>
  </div>
  <div class="board push" id="board">
    <canvas id="cv" data-ta="pi.board" aria-label="磚畫謎的格子"></canvas>
    <div class="over list" id="list"></div>
    <div class="over reveal" id="win" hidden>
      <h2 id="winName" data-t="pi.done">完成！</h2>
      <div class="big stars" id="winStars">★★★</div>
      <p id="winNote"></p>
      <div class="row"><button class="btn" type="button" id="next" data-t="pi.next">下一幅</button><button class="btn plain" type="button" id="again" data-t="pi.again">再畫一次</button><button class="btn plain" type="button" id="toList" data-t="pi.list">圖片列表</button></div>
    </div>
    <div class="over" id="lost" hidden>
      <h2 data-t="g.over">命用完了</h2>
      <p data-t="pi.overP">再試一次，這次多用打叉把確定是空的格子標起來。</p>
      <div class="row"><button class="btn" type="button" id="retry" data-t="pi.retry">再試一次</button><button class="btn plain" type="button" id="toList2" data-t="pi.list">圖片列表</button></div>
    </div>
  </div>
  <p class="hint" data-t="pi.hint">按住拖曳可以一次填一整排；滑鼠右鍵或 X 鍵切換打叉</p>
</main>
<script src="../words.js?v=549b329472"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=2453e265fc"></script>
<script src="pics.js?v=a1e6b87dbf"></script>
<script src="picross.js?v=7a4e4b8570"></script>
<script src="../drawer-icons.js?v=82db3efbf9"></script>
<script src="../nav.js?v=a0ad2d2f90"></script>
</body>
</html>
