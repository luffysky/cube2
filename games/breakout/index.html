<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.breakout" data-desc="bo.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打磚塊 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="打磚塊：用板子把球彈回去，把整面磚牆打光。打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/breakout/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/breakout/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/breakout/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/breakout/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/breakout/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/breakout/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/breakout/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=6229800d26">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.breakout">打磚塊</h1>
    <button type="button" id="pause" data-t="g.pause">暫停</button>
  </div>
  <div class="stats">
    <div><b id="score">0</b><span data-t="g.score">分數</span></div>
    <div class="hearts-box"><b id="hearts" data-ta="g.livesA" aria-label="剩下的命">♥♥♥♥♥</b><span data-tk="bo.stage" data-tv="stage">第 <i id="stage">1</i> 關</span></div>
    <div><b id="best">0</b><span data-t="g.best">最佳</span></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" data-ta="bo.board" aria-label="打磚塊的場地"></canvas>
    <div class="over" id="intro">
      <h2 data-t="n.breakout">打磚塊</h2>
      <p data-t="bo.p1">用板子把球彈回去，把磚打光就過關，下一關球會快一點。水泥磚要打兩下，鐵磚打不破。</p>
      <p data-t="bo.p2">有白點的磚打破會掉道具：加寬板子、多兩顆球、球變慢，偶爾掉一顆愛心。有 5 條命，球全部掉下去少一條。</p>
      <div class="seg" role="radiogroup" data-ta="g.lvA" aria-label="難度">
        <button type="button" role="radio" data-lv="easy" data-t="g.easy">簡單</button>
        <button type="button" role="radio" data-lv="normal" data-t="g.normal">普通</button>
        <button type="button" role="radio" data-lv="hard" data-t="g.hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go" data-t="g.start">開始</button></div>
      <p id="keysHint" data-t="bo.keys">方向鍵或滑鼠移動板子，空白鍵發球</p>
    </div>
    <div class="over" id="end" hidden>
      <h2 data-t="g.over">命用完了</h2>
      <div class="big" id="endScore">0</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again" data-t="g.again">再玩一次</button><button class="btn plain" type="button" id="toIntro" data-t="g.change">換難度</button><a class="btn plain" href="../" data-t="g.other">其他遊戲</a></div>
    </div>
    <div class="over soft" id="ouch" hidden><h2 id="ouchT"></h2><p id="ouchP"></p></div>
    <div class="over" id="paused" hidden>
      <h2 data-t="g.paused">暫停中</h2>
      <div class="row"><button class="btn" type="button" id="resume" data-t="g.resume">繼續</button></div>
    </div>
  </div>
</main>
<script src="../words.js?v=549b329472"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=2453e265fc"></script>
<script src="breakout.js?v=f39a3e7b89"></script>
<script src="../drawer-icons.js?v=4c7b4b3818"></script>
<script src="../nav.js?v=a0ad2d2f90"></script>
</body>
</html>
