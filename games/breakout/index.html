<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打磚塊 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="打磚塊：用板子把球彈回去，把整面磚牆打光。打開瀏覽器就能玩。">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css">
</head>
<body>
<main class="game">
  <div class="bar">
    <a href="../" aria-label="回到全部遊戲">← 遊戲</a>
    <h1>打磚塊</h1>
    <button type="button" id="pause">暫停</button>
  </div>
  <div class="stats">
    <div><b id="score">0</b><span>分數</span></div>
    <div class="hearts-box"><b id="hearts" aria-label="剩下的命">♥♥♥♥♥</b><span>第 <i id="stage">1</i> 關</span></div>
    <div><b id="best">0</b><span>最佳</span></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" aria-label="打磚塊的場地"></canvas>
    <div class="over" id="intro">
      <h2>打磚塊</h2>
      <p>用板子把球彈回去，把磚打光就過關，下一關球會快一點。水泥磚要打兩下，鐵磚打不破。</p>
      <p>有白點的磚打破會掉道具：加寬板子、多兩顆球、球變慢，偶爾掉一顆愛心。有 5 條命，球全部掉下去少一條。</p>
      <div class="seg" role="radiogroup" aria-label="難度">
        <button type="button" role="radio" data-lv="easy">簡單</button>
        <button type="button" role="radio" data-lv="normal">普通</button>
        <button type="button" role="radio" data-lv="hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go">開始</button></div>
      <p id="keysHint">方向鍵或滑鼠移動板子，空白鍵發球</p>
    </div>
    <div class="over" id="end" hidden>
      <h2>命用完了</h2>
      <div class="big" id="endScore">0</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again">再玩一次</button><button class="btn plain" type="button" id="toIntro">換難度</button><a class="btn plain" href="../">其他遊戲</a></div>
    </div>
    <div class="over soft" id="ouch" hidden><h2 id="ouchT"></h2><p id="ouchP"></p></div>
    <div class="over" id="paused" hidden>
      <h2>暫停中</h2>
      <div class="row"><button class="btn" type="button" id="resume">繼續</button></div>
    </div>
  </div>
</main>
<script src="../rewards.js"></script>
<script src="breakout.js"></script>
<script src="../nav.js"></script>
</body>
</html>
