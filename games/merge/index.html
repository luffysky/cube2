<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磚塊合成 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="磚塊合成：把一樣的數字磚放在一起合成更大的磚，看你能合到多少。打開瀏覽器就能玩。">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=48ca3edc70">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<main class="game">
  <div class="bar">
    <a href="../" aria-label="回到全部遊戲">← 遊戲</a>
    <h1>磚塊合成</h1>
    <button type="button" id="pause">暫停</button>
  </div>
  <div class="stats">
    <div><b id="score">0</b><span>分數</span></div>
    <div class="hearts-box"><b id="hearts" aria-label="剩下的命">♥♥♥♥♥</b><span>最大 <i id="top">2</i></span></div>
    <div><b id="best">0</b><span>最佳</span></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" aria-label="磚塊合成的場地"></canvas>
    <div class="over" id="intro">
      <h2>磚塊合成</h2>
      <p>點一排把數字磚放下去。落下的磚碰到一樣數字的磚就會合成：兩塊變兩倍，三塊變四倍。合成後的磚落下又碰到一樣的，會繼續連鎖。</p>
      <p>放進已經滿的那排會少一條命，最上面三排碎掉；有 5 條命。普通和困難偶爾會掉下水泥塊，在它旁邊合成就能打碎。</p>
      <div class="seg" role="radiogroup" aria-label="難度">
        <button type="button" role="radio" data-lv="easy">簡單</button>
        <button type="button" role="radio" data-lv="normal">普通</button>
        <button type="button" role="radio" data-lv="hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go">開始</button></div>
      <p id="keysHint">滑鼠點一排，或用方向鍵選、空白鍵放；數字鍵 1–5 直接放</p>
    </div>
    <div class="over" id="end" hidden>
      <h2>命用完了</h2>
      <div class="big" id="endScore">0</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again">再玩一次</button><button class="btn plain" type="button" id="toIntro">換難度</button><a class="btn plain" href="../">其他遊戲</a></div>
    </div>
    <div class="over soft" id="ouch" hidden><h2 id="ouchT"></h2><p id="ouchP"></p></div>
    <div class="over" id="paused" hidden>
      <h2>暫停中</h2>
      <div class="row"><button class="btn" type="button" id="resume">繼續</button></div>
    </div>
  </div>
</main>
<script src="../rewards.js?v=4028e3604e"></script>
<script src="merge.js?v=5127dfa888"></script>
<script src="../nav.js?v=9b26f60da5"></script>
</body>
</html>
