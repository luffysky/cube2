<!DOCTYPE html>
<html lang="zh-Hant" data-title="n.pipes" data-desc="pp.desc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磚道 · SnowRealm 磚塊遊戲</title>
<meta name="description" content="磚道：轉動每一塊水管磚，讓水流進每一格。打開瀏覽器就能玩。">
<link rel="canonical" href="https://brickduel.snowrealm.pet/games/pipes/">
<link rel="alternate" hreflang="zh-Hant" href="https://brickduel.snowrealm.pet/games/pipes/">
<link rel="alternate" hreflang="zh-Hans" href="https://brickduel.snowrealm.pet/games/pipes/?lang=zh-Hans">
<link rel="alternate" hreflang="en" href="https://brickduel.snowrealm.pet/games/pipes/?lang=en">
<link rel="alternate" hreflang="ja" href="https://brickduel.snowrealm.pet/games/pipes/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://brickduel.snowrealm.pet/games/pipes/?lang=ko">
<link rel="alternate" hreflang="x-default" href="https://brickduel.snowrealm.pet/games/pipes/">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../games.css?v=9d91105f2f">
<link rel="stylesheet" href="../drawer-items.css?v=f1c599a9fd">
<link rel="stylesheet" href="../site-themes.css?v=98bc738adf">
<script src="../theme.js?v=034b918854"></script>
</head>
<body>
<div id="gboot" role="status" aria-live="polite" style="--gb:#5DB7F5"><div class="gb-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p><span data-t="g.loading">載入中</span><b class="gb-d"><i>.</i><i>.</i><i>.</i></b></p></div>
<main class="game">
  <div class="bar">
    <a href="../" data-ta="g.backA" data-t="g.back">← 遊戲</a>
    <h1 data-t="n.pipes">磚道</h1>
    <span></span>
  </div>
  <div class="stats">
    <div><b id="time">0:00</b><span data-t="g.time">時間</span></div>
    <div class="hearts-box"><b id="taps" class="lvname">0</b><span data-t="pp.taps">轉了幾下</span></div>
    <div><b id="best">—</b><span data-t="g.fast">最快</span></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" data-ta="pp.board" aria-label="磚道的場地"></canvas>
    <div class="over" id="intro">
      <h2 data-t="n.pipes">磚道</h2>
      <p data-t="pp.p1">點一塊水管磚就轉 90 度（滑鼠右鍵反著轉）。水從中間的金色磚流出來，讓水流進每一格、沒有水管開口朝外，就完成了。</p>
      <p data-t="pp.p2">每一局都是新的，一定解得出來。三種難度是 5×5、7×7、9×9，記最快的時間。</p>
      <div class="seg" role="radiogroup" data-ta="g.lvA" aria-label="難度">
        <button type="button" role="radio" data-lv="easy" data-t="g.easy">簡單</button>
        <button type="button" role="radio" data-lv="normal" data-t="g.normal">普通</button>
        <button type="button" role="radio" data-lv="hard" data-t="g.hard">困難</button>
      </div>
      <div class="row"><button class="btn" type="button" id="go" data-t="g.start">開始</button></div>
      
    </div>
    <div class="over reveal" id="end" hidden>
      <h2 data-t="pp.done">水都流到了！</h2>
      <div class="big" id="endScore">0:00</div>
      <p id="endNote"></p>
      <div class="row"><button class="btn" type="button" id="again" data-t="g.again2">再一局</button><button class="btn plain" type="button" id="toIntro" data-t="g.change">換難度</button><a class="btn plain" href="../" data-t="g.other">其他遊戲</a></div>
    </div>
  </div>
</main>
<script src="../words.js?v=e7601ec874"></script>
<script src="../i18n.js?v=91f00f02b0"></script>
<script src="../rewards.js?v=2453e265fc"></script>
<script src="pipes.js?v=403c843995"></script>
<script src="../drawer-icons.js?v=9cd5c51bd0"></script>
<script src="../nav.js?v=e272c06d10"></script>
</body>
</html>
